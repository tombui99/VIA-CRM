<h2 [class]="hlmH2">Sales</h2>
@if(salesQuery.error()) {
<div class="flex h-48 w-full items-center justify-center">
  <div class="text-destructive text-sm">Error loading sales: {{ salesQuery.error()?.message }}</div>
</div>
} @if (salesQuery.isLoading()) {
<div class="flex h-48 w-full items-center justify-center">
  <div class="text-muted-foreground text-sm">Loading...</div>
</div>
} @else if(hasResults()) {
<div class="flex w-full max-w-sm items-center gap-2 mb-6 mt-4">
  <input class="w-80" hlmInput type="email" placeholder="Search sales..." />
  <button hlmBtn variant="outline">
    <ng-icon hlm name="lucideSearch" />
  </button>
</div>
<custom-datatable
  [data]="salesQuery.data()"
  [columns]="columns()"
  [options]="{ enableResizing: true, minSize: 60, maxSize: 800, tableId: 'users-table' }"
>
</custom-datatable>
}
